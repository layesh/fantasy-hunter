[project]
name = "fantasy-hunter-backend"
version = "0.1.0"
description = "FPL analytics platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pulp>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# PuLP 3.3 deprecates LpVariable.dicts and PULP_CBC_CMD ahead of 4.0. Both still
# work; migrating is a separate job from the test output being readable.
filterwarnings = ["ignore::DeprecationWarning:pulp.*"]
